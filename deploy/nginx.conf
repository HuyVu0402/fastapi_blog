# Replace blog.example.com before enabling. Certbot adds HTTPS after DNS setup.
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    # Allow multipart overhead above the application's 5 MiB image limit.
    client_max_body_size 6M;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /static/ {
        alias /srv/fastapi-blog/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Preserve the application's Referrer-Policy on password-reset pages.
    }
}
